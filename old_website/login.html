<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In – RecipeBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
    }

    .auth-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-2xl);
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .auth-logo-text {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    .auth-title {
      font-size: 1.375rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: var(--space-xs);
    }

    .auth-subtitle {
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 0.9rem;
      margin-bottom: var(--space-xl);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin: var(--space-sm) 0;
      color: var(--color-text-muted);
      font-size: 0.8125rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: var(--color-border);
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      width: 100%;
      padding: 10px var(--space-md);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      background-color: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-sans);
    }

    .btn-social:hover {
      border-color: var(--color-primary);
      background-color: var(--color-primary-light);
    }

    .btn-social-icon {
      font-size: 1.1rem;
      line-height: 1;
    }

    .auth-footer-text {
      text-align: center;
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      margin-top: var(--space-lg);
    }

    .auth-link {
      color: var(--color-primary);
      font-weight: 500;
      transition: opacity var(--transition);
    }

    .auth-link:hover {
      opacity: 0.75;
    }

    .forgot-link {
      font-size: 0.8125rem;
      color: var(--color-primary);
      font-weight: 500;
      text-align: right;
      margin-top: -var(--space-xs);
      display: block;
      transition: opacity var(--transition);
    }

    .forgot-link:hover {
      opacity: 0.75;
    }

    .form-error {
      font-size: 0.8125rem;
      color: var(--color-danger);
      display: none;
    }

    .password-field-wrap {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: var(--space-md);
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.875rem;
      color: var(--color-text-muted);
      cursor: pointer;
      user-select: none;
    }

    .password-toggle:hover {
      color: var(--color-text);
    }

    .password-field-wrap .form-input {
      padding-right: 48px;
    }

    .alert {
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
    }

    .alert--error {
      background: var(--color-danger-bg);
      color: var(--color-danger-text);
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: var(--space-xl) var(--space-md);
      }
    }
  </style>
</head>

<body class="auth-page">

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="home.html" class="logo">🍴 RecipeBook</a>
      <div class="nav-actions" style="margin-left:auto;">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">☀️</button>
      </div>
    </div>
  </header>

  <!-- ===== Auth Body ===== -->
  <main class="auth-body">
    <div class="auth-card">

      <div class="auth-logo">
        <span class="auth-logo-text">🍴 RecipeBook</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to access your recipes</p>

      <div class="alert alert--error" id="loginError">
        Incorrect email or password. Please try again.
      </div>

      <form class="auth-form" id="loginForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" autocomplete="email"
            required />
          <span class="form-error" id="emailError">Please enter a valid email.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-field-wrap">
            <input type="password" class="form-input" id="password" placeholder="Enter your password"
              autocomplete="current-password" required />
            <span class="password-toggle" data-target="password">Show</span>
          </div>
          <span class="form-error" id="passwordError">Please enter your password.</span>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">
          Log In
        </button>

      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="signup.html" class="auth-link">Sign up free</a>
      </p>

    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-text">© 2026 RecipeBook. Share food, share love.</p>
    </div>
  </footer>

  <script>
    // --- Theme ---
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('rb-theme') || 'light';
    html.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

    themeToggle.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('rb-theme', next);
      themeToggle.textContent = next === 'dark' ? '🌙' : '☀️';
    });

    // --- Show/hide password ---
    document.querySelectorAll('.password-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.dataset.target);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        toggle.textContent = isHidden ? 'Hide' : 'Show';
      });
    });

    // --- Form submit ---
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errBanner = document.getElementById('loginError');

      // Basic client-side validation
      let valid = true;

      const emailErr = document.getElementById('emailError');
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailErr.style.display = 'block';
        valid = false;
      } else {
        emailErr.style.display = 'none';
      }

      const pwErr = document.getElementById('passwordError');
      if (!password) {
        pwErr.style.display = 'block';
        valid = false;
      } else {
        pwErr.style.display = 'none';
      }

      if (!valid) return;

      errBanner.style.display = 'none';

      try {
        await api.auth.login({ email, password });
        window.location.href = 'my_account.html';
      } catch {
        errBanner.style.display = 'block';
      }
    });


  </script>
  <script src="https://app.dande-link.com/scripts/portalApiClient.js"></script>
  <script>
    const api = new PortalApiClient('https://app.dande-link.com');
  </script>
</body>

</html>
